[package]
name = "tmb_game"
version = "0.1.0"
description = "Trust Me Bros game protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tmb_game"

[features]
# Exactly one of `devnet` / `mainnet` selects the program id + Switchboard program.
default = ["devnet"]
devnet = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
mpl-core = { version = "=0.11.1" }

[dev-dependencies]
proptest = "1"
