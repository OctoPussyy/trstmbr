[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Same program name on every cluster; only the address (and the cargo feature used to build) differs.
[programs.localnet]
tmb_game = "Axew8h91qZGHhxWBeapvx8Fd7EXVk82xYQCY6kxRcBNv"

[programs.devnet]
tmb_game = "Axew8h91qZGHhxWBeapvx8Fd7EXVk82xYQCY6kxRcBNv"

[programs.mainnet]
tmb_game = "AuWBVGU95FjrUpEzEQkEWEPUg9fpcQn5ZReVypp2kyva"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = true

# Metaplex Core (real binary, downloaded by `npm run fixtures`)
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core.so"

# Test-only mock of Switchboard On-Demand at its DEVNET id (tests run the default `devnet` build)
[[test.genesis]]
address = "Aio4gaXjXzJNVLtzwtNVmSqGKpANtXhybbkhtAC94ji2"
program = "tests/fixtures/mock_switchboard.so"
