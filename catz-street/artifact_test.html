  #wrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #hud { pointer-events: none; }
</style>
